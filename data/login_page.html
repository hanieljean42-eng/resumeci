<script>
    document.getElementById('formModifierProfil').addEventListener('submit', function (e) {
        var telephoneInput = document.getElementById('telephone');
        var resultDiv = document.getElementById('resultMessage');

        if (!telephoneInput || telephoneInput.value.trim() === '') {
            e.preventDefault();
            if (resultDiv) {
                resultDiv.innerHTML = '<h5 style="text-align:center; font-weight:bold; color:red;">Veuillez saisir votre téléphone pour modifier votre profil.</h5>';
            }
            return;
        }

        // On copie la valeur du champ téléphone dans le champ hidden
        document.getElementById('username_modifier').value = telephoneInput.value;
    });
</script>
