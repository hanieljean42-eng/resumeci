services:
  - type: web
    name: resumeci
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
    routes:
      - type: redirect
        source: https://resumeci.onrender.com/*
        destination: https://resumeci.me/*
      - type: redirect
        source: http://resumeci.onrender.com/*
        destination: https://resumeci.me/*
      - type: rewrite
        source: /*
        destination: /index.html
