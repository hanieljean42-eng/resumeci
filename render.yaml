services:
  - type: web
    name: resumeci
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./public
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: microphone=(self), camera=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://api.qrserver.com; connect-src 'self' https://api.qrserver.com;"
      - path: /sitemap.html
        name: X-Robots-Tag
        value: noindex, follow
    routes:
      - type: redirect
        source: https://resumeci.onrender.com/*
        destination: https://resumeci.me/*
      - type: redirect
        source: http://resumeci.onrender.com/*
        destination: https://resumeci.me/*
      - type: rewrite
        source: /*
        destination: /index.html
