<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>Connexion à ton Espace Élève | ResumeCI</title>
  <meta name="description" content="Connecte-toi à ton compte ResumeCI pour retrouver tes fiches de révision, tes favoris et tes fonctionnalités Pass.">
  <link rel="canonical" href="https://resumeci.me/connexion.html">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="theme-color" content="#0b1120">
  <meta property="og:title" content="Connexion | ResumeCI — Espace Élève">
  <meta property="og:description" content="Connecte-toi pour retrouver tes fiches, tes favoris et ton Pass Pro.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://resumeci.me/connexion.html">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --primary: #2563eb;
      --primary-light: #3b82f6;
      --accent: #10b981;
      --bg: #0b1120;
      --bg-card: rgba(30, 41, 59, 0.92);
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --danger: #ef4444;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(37, 99, 235, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 20% 80%, rgba(16, 185, 129, 0.06) 0%, transparent 40%);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 12px calc(16px + var(--safe-bottom));
      overflow-x: hidden;
    }

    .page-wrap {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: fadeUp 0.5s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========== HEADER ========== */
    .header {
      text-align: center;
      padding: 4px 0 0;
    }

    .header-flag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(37, 99, 235, 0.12);
      border: 1px solid rgba(37, 99, 235, 0.3);
      padding: 5px 14px;
      border-radius: 9999px;
      color: #93c5fd;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-bottom: 10px;
    }

    .header h1 {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(22px, 6vw, 26px);
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 5px;
      background: linear-gradient(135deg, #fff 40%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      color: var(--text-muted);
      font-size: clamp(12px, 3.5vw, 13.5px);
      line-height: 1.5;
    }

    /* ========== CARD ========== */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: clamp(18px, 5vw, 26px);
      box-shadow: 
        0 20px 45px -10px rgba(0, 0, 0, 0.55),
        0 0 30px rgba(37, 99, 235, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* ========== FORM ========== */
    .form-group { margin-bottom: 14px; }

    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 5px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap .ic {
      position: absolute;
      left: 12px;
      color: var(--text-dim);
      font-size: 13px;
      pointer-events: none;
      transition: color 0.2s;
    }

    .field {
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1.5px solid var(--border);
      color: #fff;
      padding: 12px 14px 12px 36px;
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }

    .field::placeholder { color: var(--text-dim); }

    .field:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.18);
    }

    .field:focus ~ .ic { color: var(--primary-light); }

    .pwd-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s;
    }
    .pwd-toggle:hover { color: var(--text); }

    /* ========== BUTTON ========== */
    .submit-btn {
      width: 100%;
      padding: 14px 16px;
      border-radius: 13px;
      border: none;
      background: linear-gradient(135deg, var(--primary) 0%, #1d4ed8 100%);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      margin-top: 18px;
      min-height: 48px;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.45);
    }

    .submit-btn:active { transform: translateY(0); }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .spinner { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ========== LINKS ========== */
    .switch-link {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .switch-link a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      border-bottom: 1px solid rgba(16, 185, 129, 0.35);
      padding-bottom: 1px;
      transition: color 0.2s;
    }

    .switch-link a:hover { color: #34d399; }

    .back-link {
      display: block;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
      text-decoration: none;
      transition: color 0.2s;
      padding: 4px 0;
    }
    .back-link:hover { color: #fff; }

    /* ========== ERROR ========== */
    .error-banner {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 10px 12px;
      border-radius: 11px;
      font-size: 12.5px;
      margin-bottom: 12px;
      display: none;
      line-height: 1.4;
      animation: fadeIn 0.25s ease-out;
    }

    /* ========== INFO ========== */
    .info-banner {
      background: rgba(37, 99, 235, 0.1);
      border: 1px solid rgba(37, 99, 235, 0.25);
      color: #93c5fd;
      padding: 10px 12px;
      border-radius: 11px;
      font-size: 12px;
      margin-bottom: 14px;
      line-height: 1.45;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .info-banner i { margin-top: 2px; flex-shrink: 0; }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 380px) {
      body { padding: 10px 8px; }
      .card { padding: 16px 12px; }
    }

    @media (max-width: 340px) {
      .header h1 { font-size: 19px; }
    }

    @supports (padding: env(safe-area-inset-bottom)) {
      body { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>

  <div class="page-wrap">
    <!-- HEADER -->
    <div class="header">
      <div class="header-flag"><i class="fas fa-user-graduate"></i> Espace Élève 🇨🇮</div>
      <h1>Bon retour parmi nous ! 👋</h1>
      <p>Connecte-toi pour retrouver ta classe, tes favoris et ton Pass.</p>
    </div>

    <!-- CARD -->
    <div class="card">
      <div class="error-banner" id="errorBox"></div>

      <div class="info-banner">
        <i class="fas fa-circle-info"></i>
        <span>Utilise le numéro WhatsApp et le mot de passe que tu as choisis lors de ton inscription.</span>
      </div>

      <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();" novalidate>
        <div class="form-group">
          <label class="form-label" for="logWhatsapp">Numéro WhatsApp (10 chiffres) *</label>
          <div class="input-wrap">
            <input type="tel" id="logWhatsapp" class="field" placeholder="Ex: 07 08 09 10 11" maxlength="14" required autocomplete="tel" enterkeyhint="next" inputmode="tel">
            <i class="fab fa-whatsapp ic" style="color:#25d366"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="logPassword">Mot de passe secret *</label>
          <div class="input-wrap">
            <input type="password" id="logPassword" class="field" placeholder="Ton mot de passe" required autocomplete="current-password" enterkeyhint="done" style="padding-right:40px">
            <i class="fas fa-lock ic"></i>
            <button type="button" class="pwd-toggle" onclick="togglePwd()" aria-label="Afficher le mot de passe"><i class="fas fa-eye" id="pwdEyeIcon"></i></button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="logSubmitBtn">
          <span><i class="fas fa-arrow-right-to-bracket"></i></span>
          <span id="btnText">Se Connecter 🚀</span>
        </button>

        <div class="switch-link">
          Pas encore inscrit ? <a href="/inscription.html">Créer mon compte en 30s</a>
        </div>
      </form>
    </div>

    <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Retourner à l'accueil du site</a>
  </div>

  <script>
    function togglePwd() {
      const pwd = document.getElementById('logPassword');
      const icon = document.getElementById('pwdEyeIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'fas fa-eye';
      }
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.innerHTML = msg;
      box.style.display = 'block';
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function hideError() {
      document.getElementById('errorBox').style.display = 'none';
    }

    function getPaymentApiBase() {
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        return 'http://127.0.0.1:3000';
      }
      return window.RESUMECI_API_URL || 'https://resumeci-payment-api.onrender.com';
    }

    async function handleLogin() {
      hideError();

      const wa = document.getElementById('logWhatsapp').value.trim();
      const pwd = document.getElementById('logPassword').value;
      const btn = document.getElementById('logSubmitBtn');

      const cleanWa = wa.replace(/\D/g, '');
      if (cleanWa.length < 10) {
        showError("⚠️ Le numéro WhatsApp doit comporter 10 chiffres.");
        return;
      }

      if (!pwd) {
        showError("⚠️ Entre ton mot de passe.");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner spinner"></i> Connexion en cours...';

      try {
        // 1. Tentative de connexion via l'API serveur (vérification Firestore & restauration abonnement)
        let loginSuccess = false;
        const apiBase = getPaymentApiBase();
        try {
          const apiRes = await fetch(`${apiBase}/api/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ whatsapp: cleanWa, password: pwd })
          });
          if (apiRes.ok && apiRes.headers.get('content-type')?.includes('application/json')) {
            const apiData = await apiRes.json();

            if (apiData.success && apiData.profile) {
              const profile = apiData.profile;
              // Sauvegarder le profil complet restauré avec son abonnement payant
              localStorage.setItem('resumeci_profile', JSON.stringify(profile));

              // S'assurer que le streak est actif
              if (!localStorage.getItem('resumeci_streak')) {
                const d = new Date();
                const todayStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
                localStorage.setItem('resumeci_streak', JSON.stringify({
                  count: 1,
                  lastDay: todayStr,
                  lastActiveAt: Date.now()
                }));
              }

              loginSuccess = true;
              btn.innerHTML = '<i class="fas fa-check"></i> Connecté ! Redirection...';
              setTimeout(() => {
                window.location.href = '/?welcome=1';
              }, 500);
              return;
            } else if (apiData && apiData.error) {
              if (apiRes.status === 401) {
                showError("❌ " + apiData.error);
                resetBtn();
                return;
              }
            }
          }
        } catch(apiErr) {
          console.warn("API login non disponible, tentative locale:", apiErr);
        }

        // 2. Secours local (hors-ligne ou profil sauvegardé sur l'appareil)
        const raw = localStorage.getItem('resumeci_profile');
        if (raw) {
          const localProf = JSON.parse(raw);
          if (localProf.whatsapp === cleanWa && (localProf.password === pwd || !localProf.password)) {
            window.location.href = '/?welcome=1';
            return;
          } else if (localProf.whatsapp === cleanWa && localProf.password !== pwd) {
            showError("❌ Mot de passe incorrect. Réessaie ou contacte l'assistance.");
            resetBtn();
            return;
          }
        }

        // Aucun compte trouvé
        showError("❌ Aucun compte trouvé avec ce numéro WhatsApp (+225 " + cleanWa + "). <br><a href='/inscription.html' style='color:#60a5fa;font-weight:700'>Clique ici pour créer ton compte en 30 secondes</a>.");
        resetBtn();

      } catch (err) {
        console.warn("Erreur login:", err);
        showError("❌ Erreur lors de la connexion. Vérifie ta connexion internet.");
        resetBtn();
      }
    }

    function resetBtn() {
      const btn = document.getElementById('logSubmitBtn');
      btn.disabled = false;
      btn.innerHTML = '<span><i class="fas fa-arrow-right-to-bracket"></i></span> <span id="btnText">Se Connecter 🚀</span>';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const raw = localStorage.getItem('resumeci_profile');
      if (raw) {
        try {
          const prof = JSON.parse(raw);
          if (prof && prof.whatsapp && !window.location.search.includes('force=1')) {
            window.location.href = '/';
          }
        } catch(e) {}
      }
    });
  </script>
</body>
</html>
