  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root{--bg:#0f172a;--card:#1e293b;--card2:#334155;--accent:#3b82f6;--green:#10b981;--red:#ef4444;--orange:#f59e0b;--text:#f1f5f9;--muted:#94a3b8;--gold:#fbbf24;--radius:16px}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .container{max-width:600px;margin:0 auto;padding:20px}
    .header{text-align:center;padding:30px 0 20px}
    .header h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,#10b981,#3b82f6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .header p{color:var(--muted);font-size:14px;margin-top:4px}
    .back-btn{position:fixed;top:20px;left:20px;background:var(--card);border:1px solid #475569;padding:10px 16px;border-radius:10px;color:var(--text);text-decoration:none;font-size:13px;display:flex;align-items:center;gap:6px;transition:.2s;z-index:10}
    .back-btn:hover{background:var(--accent);border-color:var(--accent)}

    /* Subject selector */
    .deck-selector{margin:16px 0;display:grid;gap:10px}
    .deck-selector label{font-size:13px;font-weight:600;color:var(--muted)}
    .deck-selector select{width:100%;background:var(--card);border:1px solid #475569;color:var(--text);padding:12px 16px;border-radius:10px;font-size:14px;outline:none}
    .deck-selector select:focus{border-color:var(--accent)}
    
    /* Stats bar */
    .stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
    .mini-stat{background:var(--card);border-radius:12px;padding:14px;text-align:center}
    .mini-stat .val{font-size:20px;font-weight:800}
    .mini-stat .lbl{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase}

    /* Flashcard */
    .card-wrapper{perspective:1000px;margin:24px 0;height:320px;cursor:pointer;position:relative}
    .flashcard{width:100%;height:100%;position:relative;transition:transform .6s;transform-style:preserve-3d;border-radius:var(--radius)}
    .flashcard.flipped{transform:rotateY(180deg)}
    .card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
    .card-front{background:linear-gradient(135deg,#1e3a5f,#1e293b);border:2px solid #3b82f680}
    .card-front .card-label{font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;font-weight:600}
    .card-front .card-text{font-size:18px;font-weight:700;line-height:1.6}
    .card-front .card-tap{position:absolute;bottom:18px;font-size:11px;color:var(--muted)}
    .card-back{background:linear-gradient(135deg,#064e3b,#1e293b);border:2px solid #10b98180;transform:rotateY(180deg)}
    .card-back .card-label{font-size:11px;color:var(--green);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;font-weight:600}
    .card-back .card-text{font-size:16px;font-weight:500;line-height:1.7;color:#d1fae5}

    /* Rating buttons */
    .rating-area{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
    .rate-btn{padding:14px;border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;text-align:center}
    .rate-btn:hover{transform:scale(1.05)}
    .rate-btn.hard{background:#450a0a;color:#fca5a5;border:2px solid var(--red)}
    .rate-btn.medium{background:#451a03;color:#fed7aa;border:2px solid var(--orange)}
    .rate-btn.easy{background:#064e3b;color:#6ee7b7;border:2px solid var(--green)}
    .rate-btn .sub{font-size:10px;display:block;margin-top:2px;opacity:.7}

    /* Progress */
    .session-progress{background:var(--card);border-radius:12px;padding:16px;margin:16px 0}
    .session-progress h3{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--muted)}
    .progress-track{background:var(--card2);border-radius:10px;height:8px;overflow:hidden}
    .progress-fill{height:100%;border-radius:10px;transition:width .4s}
    .progress-labels{display:flex;justify-content:space-between;font-size:11px;margin-top:6px;color:var(--muted)}
    
    /* Empty state */
    .empty-state{text-align:center;padding:60px 20px}
    .empty-state .icon{font-size:48px;margin-bottom:16px}
    .empty-state h3{font-size:18px;margin-bottom:8px}
    .empty-state p{color:var(--muted);font-size:13px}

    /* Review session done */
    .done-card{text-align:center;background:var(--card);border-radius:var(--radius);padding:40px;margin:20px 0}
    .done-card .emoji{font-size:56px;margin-bottom:12px}
    .done-card h2{font-size:22px;font-weight:800;margin-bottom:8px}
    .done-card p{color:var(--muted);font-size:13px;margin-bottom:16px}
    .done-card .btn{display:inline-flex;align-items:center;gap:6px;padding:12px 24px;background:var(--accent);border:none;color:#fff;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s;margin:4px}
    .done-card .btn:hover{background:#2563eb}

    /* Audio btn */
    .audio-btn{position:fixed;bottom:20px;right:20px;width:50px;height:50px;background:var(--accent);border:none;border-radius:50%;color:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 15px rgba(59,130,246,.4);transition:.3s;z-index:100}
    .audio-btn:hover{transform:scale(1.1)}
    .audio-btn.speaking{background:var(--green);animation:pulse 1s infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.4)}50%{box-shadow:0 0 0 12px rgba(16,185,129,0)}}

    @media(max-width:600px){.container{padding:12px}.stats-bar{grid-template-columns:repeat(2,1fr)}.card-wrapper{height:280px}.rating-area{grid-template-columns:1fr}}
  </style>

<body>
  <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> Fiches</a>
  <button class="audio-btn" id="audioBtn" title="Lire la carte"><i class="fas fa-volume-up"></i></button>

  <div class="container">
    <div class="header">
      <h1>Flashcards</h1>
      <p>Révision espacée — Méthode Ebbinghaus</p>
    </div>

    <div class="deck-selector">
      <label>Paquet de cartes</label>
      <select id="deckSelect">
        <option value="">-- Choisir une matière --</option>
      </select>
    </div>

    <div class="stats-bar" id="statsBar">
      <div class="mini-stat"><div class="val" id="statDue" style="color:var(--accent)">0</div><div class="lbl">À revoir</div></div>
      <div class="mini-stat"><div class="val" id="statNew" style="color:var(--green)">0</div><div class="lbl">Nouvelles</div></div>
      <div class="mini-stat"><div class="val" id="statLearned" style="color:var(--gold)">0</div><div class="lbl">Apprises</div></div>
      <div class="mini-stat"><div class="val" id="statTotal" style="color:var(--muted)">0</div><div class="lbl">Total</div></div>
    </div>

    <div id="cardArea"></div>

    <div class="session-progress" id="sessionProgress" style="display:none">
      <h3>Session en cours</h3>
      <div class="progress-track"><div class="progress-fill" id="sessionFill" style="width:0%;background:linear-gradient(90deg,var(--accent),var(--green))"></div></div>
      <div class="progress-labels"><span id="sessionDone">0 revues</span><span id="sessionRemain">0 restantes</span></div>
    </div>
  </div>

  <script>
    // ==================== FLASHCARD DATABASE ====================
    const DECKS = {
      "Philosophie": [
        {front:"Qu'est-ce que la philosophie ?",back:"La philosophie est l'amour de la sagesse, une réflexion rationnelle et critique sur les questions fondamentales de l'existence humaine."},
        {front:"Qu'est-ce que la conscience selon Descartes ?",back:"\"Je pense, donc je suis\" (Cogito ergo sum). La conscience est la certitude première, le fondement de toute connaissance."},
        {front:"Qu'est-ce que l'inconscient (Freud) ?",back:"L'inconscient est constitué de pulsions, désirs refoulés et souvenirs oubliés. Il est structuré en trois instances : le Ça (pulsions), le Moi (médiateur), le Surmoi (censure morale)."},
        {front:"Qu'est-ce que le contrat social (Rousseau) ?",back:"Un pacte par lequel les individus acceptent de renoncer à certaines libertés naturelles en échange de la protection et des avantages de la vie en société."},
        {front:"Qu'est-ce que l'aliénation du travail (Marx) ?",back:"Le travailleur est séparé du produit de son travail, de l'acte de production, de son essence humaine et des autres travailleurs. Il devient un simple instrument de production."},
        {front:"En quoi la science se distingue-t-elle de l'opinion ?",back:"La science repose sur la méthode expérimentale (observation, hypothèse, expérimentation, loi), l'objectivité et la vérifiabilité. L'opinion est subjective et non fondée rationnellement."},
        {front:"Quel est le rôle du langage selon les philosophes ?",back:"Le langage permet de penser (pas de pensée sans langage), de communiquer et de construire la culture. Il se distingue de la communication animale par sa double articulation et sa créativité."},
        {front:"Qu'est-ce que la liberté philosophique ?",back:"La liberté est la capacité d'agir selon sa propre volonté éclairée par la raison. Elle implique la responsabilité morale et peut être limitée par le devoir et la loi."},
        {front:"Religion et philosophie : quelle différence ?",back:"La philosophie cherche la vérité par la raison ; la religion propose des vérités révélées par la foi. Elles partagent les questions existentielles mais diffèrent dans leur méthode."},
        {front:"Qu'est-ce que la problématique en dissertation ?",back:"La problématique est la question centrale que pose le sujet. Elle transforme le sujet en un problème philosophique auquel la dissertation doit répondre de manière argumentée."}
      ],
      "Histoire - Géographie": [
        {front:"Quelle est la date de création de l'ONU ?",back:"24 octobre 1945 (entrée en vigueur de la Charte). La Charte a été adoptée le 26 juin 1945 à San Francisco par 51 États fondateurs."},
        {front:"Quels sont les 5 membres permanents du Conseil de sécurité de l'ONU ?",back:"États-Unis, Russie (ex-URSS), Chine, France, Royaume-Uni. Ils possèdent le droit de veto."},
        {front:"Qu'est-ce que la guerre froide ?",back:"Période de tensions (1947-1991) entre les deux blocs : Ouest (USA, capitalisme, OTAN) et Est (URSS, communisme, Pacte de Varsovie). Pas de confrontation militaire directe entre les superpuissances."},
        {front:"Quels sont les grands événements de la guerre froide ?",back:"Blocus de Berlin (1948-49), Guerre de Corée (1950-53), Crise de Cuba (1962), Guerre du Vietnam (1964-75), Chute du mur de Berlin (1989), Disparition de l'URSS (1991)."},
        {front:"Qu'est-ce que la conférence de Bandung (1955) ?",back:"Conférence réunissant 29 pays d'Asie et d'Afrique à Bandung (Indonésie). Elle marque la naissance du mouvement des non-alignés et affirme le droit des peuples à l'autodétermination."},
        {front:"Comment la Côte d'Ivoire a-t-elle obtenu son indépendance ?",back:"Par la voie pacifique et la négociation. Houphouët-Boigny a créé le SAA (1944), le PDCI (1946), fait voter la loi contre le travail forcé, puis négocié l'indépendance obtenue le 7 août 1960."},
        {front:"Comment l'Algérie a-t-elle obtenu son indépendance ?",back:"Par la lutte armée : insurrection du FLN le 1er novembre 1954, guerre de libération (1954-1962), accords d'Évian (18 mars 1962), indépendance le 5 juillet 1962."},
        {front:"Quelle est la date de création de l'UA et quel organisme remplace-t-elle ?",back:"L'Union Africaine remplace l'OUA. Décision au Sommet de Syrte (septembre 1999), adoption de l'acte constitutif à Lomé (juillet 2000), création officielle le 9 juillet 2002 à Durban."},
        {front:"Quels sont les secteurs économiques de la Côte d'Ivoire ?",back:"Primaire (agriculture : cacao 1er mondial, café, hévéa, palmier) ; Secondaire (industrie agroalimentaire, pétrole, énergie) ; Tertiaire (commerce, transport, télécoms). L'agriculture domine."},
        {front:"Comment la Corée du Sud a-t-elle réussi son développement ?",back:"En misant sur : le capital humain (éducation massive), l'industrialisation orientée vers l'export, les chaebols (Samsung, Hyundai), la R&D et les nouvelles technologies, et le soutien étatique."},
        {front:"Qu'est-ce que la CEDEAO ?",back:"Communauté Économique des États de l'Afrique de l'Ouest, créée le 28 mai 1975 à Lagos. 15 États membres. Objectifs : intégration économique, libre circulation, développement régional."},
        {front:"Qu'est-ce que la coopération UE-ACP ?",back:"Partenariat entre l'Union Européenne et les pays d'Afrique, Caraïbes et Pacifique. Conventions de Yaoundé, Lomé puis Accord de Cotonou (2000). Objectifs : aide au développement, préférences commerciales."}
      ],
      "Mathématiques": [
        {front:"Quelle est la dérivée de ln(x) ?",back:"f'(x) = 1/x, pour x > 0"},
        {front:"Quelle est la dérivée de e^x ?",back:"f'(x) = e^x (elle est égale à elle-même)"},
        {front:"ln(a × b) = ?",back:"ln(a) + ln(b) — Le logarithme transforme un produit en somme"},
        {front:"ln(a/b) = ?",back:"ln(a) - ln(b) — Le logarithme transforme un quotient en différence"},
        {front:"Somme des n premiers termes d'une suite arithmétique ?",back:"Sₙ = n × (a₁ + aₙ)/2 = n × (2a₁ + (n-1)r)/2"},
        {front:"Somme des n premiers termes d'une suite géométrique (q ≠ 1) ?",back:"Sₙ = a₁ × (1 - qⁿ) / (1 - q)"},
        {front:"Limite de e^x quand x → +∞ ?",back:"+∞. La fonction exponentielle croît plus vite que tout polynôme."},
        {front:"Limite de e^x quand x → -∞ ?",back:"0. La courbe se rapproche de l'axe des abscisses sans jamais le toucher."},
        {front:"Formule de la probabilité conditionnelle P(A|B) ?",back:"P(A|B) = P(A ∩ B) / P(B), avec P(B) ≠ 0"},
        {front:"Deux événements A et B sont indépendants si ?",back:"P(A ∩ B) = P(A) × P(B). Savoir que B s'est produit ne change pas la probabilité de A."}
      ],
      "SVT": [
        {front:"Qu'est-ce que le néphron ?",back:"Unité fonctionnelle du rein. Il comprend le glomérule (filtration), le tube contourné proximal (réabsorption), l'anse de Henlé, le tube distal et le canal collecteur."},
        {front:"Qu'est-ce que la phagocytose ?",back:"Mécanisme de l'immunité innée (non spécifique) par lequel les phagocytes (macrophages, granulocytes) ingèrent et détruisent les agents pathogènes."},
        {front:"Comment le VIH agit-il sur le système immunitaire ?",back:"Le VIH infecte et détruit les lymphocytes T4 (CD4+), affaiblissant progressivement l'immunité acquise, conduisant au SIDA (infections opportunistes)."},
        {front:"Qu'est-ce que la double fécondation ?",back:"Chez les angiospermes : un spermatozoïde féconde l'oosphère (→ embryon), l'autre féconde les noyaux polaires (→ albumen nourricier). Caractéristique des plantes à fleurs."},
        {front:"Qu'est-ce que le crossing-over ?",back:"Échange de segments entre chromosomes homologues pendant la prophase I de la méiose. Il augmente la diversité génétique en créant de nouvelles combinaisons d'allèles."},
        {front:"Différence entre mitose et méiose ?",back:"Mitose : 1 division, 2 cellules identiques (2n). Méiose : 2 divisions, 4 cellules haploïdes (n), avec brassage génétique. La méiose produit les gamètes."}
      ],
      "Physique - Chimie": [
        {front:"Loi d'Ohm ?",back:"U = R × I, où U = tension (V), R = résistance (Ω), I = intensité (A)"},
        {front:"Loi de Laplace ?",back:"F = B × I × L × sin(α), où F = force (N), B = champ magnétique (T), I = intensité (A), L = longueur du conducteur (m), α = angle"},
        {front:"Qu'est-ce qu'un acide selon Brønsted ?",back:"Un acide est un donneur de proton H⁺. Une base est un accepteur de proton H⁺. Réaction acido-basique = transfert de proton."},
        {front:"Formule de l'énergie cinétique ?",back:"Ec = ½ × m × v², où m = masse (kg), v = vitesse (m/s), Ec en Joules (J)"}
      ]
    };

    // ==================== SPACED REPETITION ENGINE ====================
    // SM-2 inspired algorithm
    function getCardState(deckName, cardIdx) {
      const key = `fc_${deckName}_${cardIdx}`;
      const stored = localStorage.getItem(key);
      if (stored) return JSON.parse(stored);
      return { interval: 0, ease: 2.5, reps: 0, nextReview: 0 };
    }

    function saveCardState(deckName, cardIdx, state) {
      localStorage.setItem(`fc_${deckName}_${cardIdx}`, JSON.stringify(state));
    }

    function rateCard(deckName, cardIdx, quality) {
      // quality: 0=hard, 1=medium, 2=easy
      const state = getCardState(deckName, cardIdx);
      if (quality === 0) {
        // Hard: reset
        state.interval = 1;
        state.reps = 0;
        state.ease = Math.max(1.3, state.ease - 0.3);
      } else if (quality === 1) {
        // Medium
        if (state.reps === 0) state.interval = 1;
        else if (state.reps === 1) state.interval = 3;
        else state.interval = Math.round(state.interval * state.ease);
        state.reps++;
        state.ease = Math.max(1.3, state.ease - 0.1);
      } else {
        // Easy
        if (state.reps === 0) state.interval = 3;
        else if (state.reps === 1) state.interval = 7;
        else state.interval = Math.round(state.interval * state.ease * 1.3);
        state.reps++;
        state.ease += 0.1;
      }
      const now = Date.now();
      state.nextReview = now + state.interval * 86400000; // days to ms
      saveCardState(deckName, cardIdx, state);
    }

    function getDueCards(deckName) {
      const deck = DECKS[deckName];
      if (!deck) return { due: [], newCards: [], learned: 0 };
      const now = Date.now();
      const due = [], newCards = [];
      let learned = 0;
      deck.forEach((card, i) => {
        const state = getCardState(deckName, i);
        if (state.reps === 0) newCards.push(i);
        else if (state.nextReview <= now) due.push(i);
        else learned++;
      });
      return { due, newCards, learned };
    }

    // ==================== UI ====================
    let currentDeck = '';
    let sessionQueue = [];
    let sessionIdx = 0;
    let sessionTotal = 0;
    let isFlipped = false;

    function populateDecks() {
      const sel = document.getElementById('deckSelect');
      for (const name of Object.keys(DECKS)) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = `${name} (${DECKS[name].length} cartes)`;
        sel.appendChild(opt);
      }
    }

    document.getElementById('deckSelect').addEventListener('change', (e) => {
      currentDeck = e.target.value;
      if (currentDeck) startSession();
      else clearSession();
    });

    function clearSession() {
      document.getElementById('cardArea').innerHTML = `<div class="empty-state"><div class="icon">🃏</div><h3>Choisis une matière</h3><p>Sélectionne un paquet pour commencer ta révision</p></div>`;
      document.getElementById('sessionProgress').style.display = 'none';
      updateStats();
    }

    function startSession() {
      const { due, newCards, learned } = getDueCards(currentDeck);
      // Session: due cards first, then up to 10 new cards
      sessionQueue = [...due, ...newCards.slice(0, 10)];
      sessionIdx = 0;
      sessionTotal = sessionQueue.length;

      updateStats();

      if (sessionQueue.length === 0) {
        document.getElementById('cardArea').innerHTML = `<div class="done-card"><div class="emoji">🎉</div><h2>Tout est révisé !</h2><p>Reviens demain pour ta prochaine session de révision.</p><button class="btn" onclick="resetDeck()"><i class="fas fa-redo"></i> Réinitialiser le paquet</button></div>`;
        document.getElementById('sessionProgress').style.display = 'none';
        return;
      }

      document.getElementById('sessionProgress').style.display = 'block';
      showCard();
    }

    function showCard() {
      if (sessionIdx >= sessionQueue.length) {
        document.getElementById('cardArea').innerHTML = `<div class="done-card"><div class="emoji">✅</div><h2>Session terminée !</h2><p>${sessionTotal} cartes revues. Bravo !</p><button class="btn" onclick="startSession()"><i class="fas fa-redo"></i> Relancer</button><button class="btn" onclick="location.href='/quiz.html'" style="background:var(--green)"><i class="fas fa-gamepad"></i> Passer au Quiz</button></div>`;
        document.getElementById('sessionProgress').style.display = 'none';
        return;
      }

      isFlipped = false;
      const cardIdx = sessionQueue[sessionIdx];
      const card = DECKS[currentDeck][cardIdx];
      const state = getCardState(currentDeck, cardIdx);
      const isNew = state.reps === 0;

      document.getElementById('cardArea').innerHTML = `
        <div class="card-wrapper" onclick="flipCard()">
          <div class="flashcard" id="flashcard">
            <div class="card-face card-front">
              <div class="card-label">${isNew ? '✨ Nouvelle carte' : '🔁 Révision'}</div>
              <div class="card-text">${card.front}</div>
              <div class="card-tap">Clique pour retourner ↻</div>
            </div>
            <div class="card-face card-back">
              <div class="card-label">Réponse</div>
              <div class="card-text">${card.back}</div>
            </div>
          </div>
        </div>
        <div class="rating-area" id="ratingArea" style="display:none">
          <button class="rate-btn hard" onclick="rate(0)">😰 Difficile<span class="sub">Revoir bientôt</span></button>
          <button class="rate-btn medium" onclick="rate(1)">🤔 Moyen<span class="sub">Dans quelques jours</span></button>
          <button class="rate-btn easy" onclick="rate(2)">😎 Facile<span class="sub">Dans longtemps</span></button>
        </div>`;
      
      updateSessionProgress();
    }

    function flipCard() {
      const fc = document.getElementById('flashcard');
      if (!isFlipped) {
        fc.classList.add('flipped');
        isFlipped = true;
        document.getElementById('ratingArea').style.display = 'grid';
      } else {
        fc.classList.remove('flipped');
        isFlipped = false;
        document.getElementById('ratingArea').style.display = 'none';
      }
    }

    function rate(quality) {
      const cardIdx = sessionQueue[sessionIdx];
      rateCard(currentDeck, cardIdx, quality);
      sessionIdx++;
      updateStats();
      showCard();
    }

    function updateSessionProgress() {
      const pct = sessionQueue.length ? Math.round((sessionIdx / sessionQueue.length) * 100) : 0;
      document.getElementById('sessionFill').style.width = `${pct}%`;
      document.getElementById('sessionDone').textContent = `${sessionIdx} revues`;
      document.getElementById('sessionRemain').textContent = `${sessionQueue.length - sessionIdx} restantes`;
    }

    function updateStats() {
      if (!currentDeck) {
        document.getElementById('statDue').textContent = '0';
        document.getElementById('statNew').textContent = '0';
        document.getElementById('statLearned').textContent = '0';
        document.getElementById('statTotal').textContent = '0';
        return;
      }
      const { due, newCards, learned } = getDueCards(currentDeck);
      document.getElementById('statDue').textContent = due.length;
      document.getElementById('statNew').textContent = newCards.length;
      document.getElementById('statLearned').textContent = learned;
      document.getElementById('statTotal').textContent = DECKS[currentDeck].length;
    }

    function resetDeck() {
      if (!currentDeck) return;
      DECKS[currentDeck].forEach((_, i) => localStorage.removeItem(`fc_${currentDeck}_${i}`));
      startSession();
    }

    // ==================== AUDIO ====================
    const audioBtn = document.getElementById('audioBtn');
    let speaking = false;
    audioBtn.addEventListener('click', () => {
      if (speaking) { speechSynthesis.cancel(); speaking = false; audioBtn.classList.remove('speaking'); return; }
      const front = document.querySelector('.card-front .card-text');
      const back = document.querySelector('.card-back .card-text');
      const text = isFlipped && back ? back.textContent : (front ? front.textContent : '');
      if (!text) return;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'fr-FR'; utter.rate = 0.85;
      utter.onend = () => { speaking = false; audioBtn.classList.remove('speaking'); };
      speechSynthesis.speak(utter);
      speaking = true; audioBtn.classList.add('speaking');
    });

    // Init
    populateDecks();
    clearSession();
  </script>
</body>
</html>
