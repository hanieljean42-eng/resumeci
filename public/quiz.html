    /* Start button */
    .start-btn{width:100%;padding:16px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:none;color:#fff;font-size:16px;font-weight:700;border-radius:12px;cursor:pointer;transition:.3s;margin:20px 0}

    /* Game UI */

    .progress-bar{background:var(--card2);border-radius:20px;height:10px;margin:16px 0;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#8b5cf6);border-radius:20px;transition:width .4s ease}
    .score-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
    .score-bar .score{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
    .score-bar .streak{font-size:13px;color:var(--orange);font-weight:600}
    .score-bar .lives{display:flex;gap:4px}
    .score-bar .lives .heart{color:var(--red);font-size:18px}

    .question-card{background:var(--card);border-radius:var(--radius);padding:30px;margin-bottom:16px;text-align:center;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center}

    .question-card .q-text{font-size:18px;font-weight:700;line-height:1.5}
    .question-card .q-hint{font-size:12px;color:var(--orange);margin-top:10px;font-style:italic}
    
    .answers{display:grid;gap:10px;margin-bottom:20px}
    .answer-btn{background:var(--card);border:2px solid #475569;border-radius:12px;padding:16px 20px;text-align:left;font-size:14px;font-weight:500;cursor:pointer;transition:.2s;color:var(--text);display:flex;align-items:center;gap:12px}

    .answer-btn.wrong .letter{background:var(--red);color:#fff}
    .answer-btn.disabled{pointer-events:none;opacity:.6}

    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

    .feedback.show{display:block;animation:fadeIn .3s}

    .feedback.wrong-fb{background:#450a0a;border:1px solid var(--red);color:#fca5a5}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    .next-btn.show{display:block}
    
    /* Results */
    .results{display:none;text-align:center;padding:40px 20px}
    .results .trophy{font-size:72px;margin-bottom:16px;animation:bounce 1s infinite}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .results h2{font-size:26px;font-weight:800;margin-bottom:8px}
    .results .final-score{font-size:48px;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--orange));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:10px 0}
    .results .stars{font-size:32px;margin:10px 0}
    .results .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
    .results .stat{background:var(--card);border-radius:12px;padding:16px}
    .results .stat .val{font-size:22px;font-weight:800}
    .results .stat .lbl{font-size:11px;color:var(--muted);margin-top:4px}
    .results .errors-section{text-align:left;background:var(--card);border-radius:12px;padding:20px;margin:20px 0}
    .results .errors-section h3{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--red)}
    .results .error-item{padding:10px 12px;border-bottom:1px solid #475569;font-size:13px;line-height:1.5}
    .results .error-item:last-child{border:none}
    .results .error-item .correct-ans{color:var(--green);font-weight:600}
    .retry-btn{padding:16px 40px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:none;color:#fff;font-size:16px;font-weight:700;border-radius:12px;cursor:pointer;margin:10px 6px;transition:.3s;box-shadow:0 4px 15px rgba(59,130,246,.4)}

    .retry-btn.primary{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 4px 15px rgba(16,185,129,.4)}
    .retry-btn.primary:hover{box-shadow:0 6px 20px rgba(16,185,129,.6)}
    
    /* Dates Game specific */
    .date-input-area{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
    .date-input-area input{background:var(--card2);border:2px solid #475569;color:var(--text);padding:12px 16px;border-radius:10px;font-size:16px;font-weight:600;text-align:center;width:160px;outline:none}
    .date-input-area input:focus{border-color:var(--accent)}
    .date-submit{padding:12px 24px;background:var(--accent);border:none;color:#fff;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px}
    
    /* XP system */
    .xp-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:20px 30px;z-index:1000;animation:popIn .4s;text-align:center;display:none}
    .xp-popup.show{display:block}
    .xp-popup .xp-val{font-size:36px;font-weight:800;color:var(--gold)}
    @keyframes popIn{from{transform:translate(-50%,-50%) scale(.5);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
    
    /* Audio button */
    .audio-btn{position:fixed;bottom:20px;right:20px;width:50px;height:50px;background:var(--accent);border:none;border-radius:50%;color:#fff;font-size:20px;cursor:pointer;box-shadow:0 4px 15px rgba(59,130,246,.4);transition:.3s;z-index:100}
    .audio-btn:hover{transform:scale(1.1)}
    .audio-btn.speaking{background:var(--green);animation:pulse 1s infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.4)}50%{box-shadow:0 0 0 12px rgba(16,185,129,0)}}
    
    @media(max-width:600px){.mode-grid{grid-template-columns:1fr}.container{padding:12px}.question-card{padding:20px}.question-card .q-text{font-size:15px}}
  </style>

      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Question suivante →</button>

      <div class="errors-section" id="errorsSection" style="display:none"></div>

    // ==================== SETUP ====================
    async function loadSubjects() {
      try {
        const struct = await fetch('/data/structure.json').then(r => r.json());
        const sel = document.getElementById('subjectSelect');
        for (const [cls, subjects] of Object.entries(struct)) {
          for (const sub of Object.keys(subjects)) {
            const opt = document.createElement('option');
            opt.value = `${cls}|${sub}`;
            opt.textContent = `${cls.replace('_',' ')} — ${sub}`;
            sel.appendChild(opt);
          }
        }
      } catch(e) {
        // Fallback: use local DB keys
        const sel = document.getElementById('subjectSelect');
        for (const sub of Object.keys(QCM_DB)) {
          const opt = document.createElement('option');
          opt.value = `all|${sub}`;
          opt.textContent = sub;
          sel.appendChild(opt);
        }
      }
    }

    function selectMode(el) {
      document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      MODE = el.dataset.mode;
      checkReady();
    }

    document.getElementById('subjectSelect').addEventListener('change', checkReady);
    function checkReady() {
      const hasSub = document.getElementById('subjectSelect').value;
      document.getElementById('startBtn').disabled = !(MODE && hasSub);
    }

    // ==================== GAME ENGINE ====================
    function startGame() {
      const subVal = document.getElementById('subjectSelect').value;
      
      QUESTIONS = generateQuestions(subVal);
      if (QUESTIONS.length === 0) { alert('Pas de questions disponibles pour cette matière.'); return; }

      currentQ = 0; score = 0; streak = 0; lives = Math.max(5, Math.ceil(QUESTIONS.length / 5)); errors = []; totalCorrect = 0;
      document.getElementById('setup').style.display = 'none';
      document.getElementById('gameArea').style.display = 'block';
      document.getElementById('results').style.display = 'none';
      renderLives();
      // Timer setup
      const mins = Math.max(0, parseInt(document.getElementById('timerMin').value||'0',10));
      stopTimer();
      if (mins>0) startTimer(mins);
      showQuestion();
    }

    function generateQuestions(subVal) {
      const subject = subVal.includes('|') ? subVal.split('|')[1] : subVal;
      let pool = [];
      if (MODE === 'dates') {
        // Dates game: uniquement pour Histoire-Géo de Terminale
        const isHistGeo = subject === 'Histoire - Géographie' || subject === 'Histoire-Geographie';
        if (!isHistGeo) { alert('Le mode Dates est disponible uniquement pour Histoire-Géographie. Choisis QCM ou Vrai/Faux pour cette matière.'); return []; }
        const cls = subVal.includes('|') ? subVal.split('|')[0] : '';
        if (cls === '5eme') { alert('Le mode Dates n\'est pas encore disponible pour la 5ème. Choisis QCM ou Vrai/Faux.'); return []; }
        const dates = [...DATES_DB];
        shuffle(dates);
        pool = dates.map((d, i) => {
          if (i % 2 === 0) {
            // Event → Date
            const wrongDates = DATES_DB.filter(x => x.date !== d.date).map(x => x.date);
            shuffle(wrongDates);
            const answers = [d.date, ...wrongDates.slice(0, 3)];
            shuffle(answers);
            return { q: d.event, answers, correct: answers.indexOf(d.date), type: 'qcm', hint: 'Quelle date ?' };
          } else {
            // Date → Event
            const wrongEvents = DATES_DB.filter(x => x.event !== d.event).map(x => x.event);
            shuffle(wrongEvents);
            const answers = [d.event, ...wrongEvents.slice(0, 3)];
            shuffle(answers);
            return { q: d.date, answers, correct: answers.indexOf(d.event), type: 'qcm', hint: 'Quel événement ?' };
          }
        });
      } else if (MODE === 'vf') {
        const vfPool = VF_DB[subVal] || VF_DB[subject];
        if (!vfPool || vfPool.length === 0) { alert('Pas de questions Vrai/Faux disponibles pour cette matière. Choisis QCM ou une autre matière.'); return []; }
        shuffle(vfPool);
        pool = vfPool.map(v => ({
          q: v.q, answers: ['Vrai', 'Faux'], correct: v.a ? 0 : 1, type: 'vf', explanation: v.expl
        }));
      } else if (MODE === 'challenge') {
        // All subjects mixed
        for (const [sub, qs] of Object.entries(QCM_DB)) {
          for (const q of qs) {
            pool.push({ q: q.q, answers: [...q.a], correct: q.c, type: 'qcm', explanation: q.expl });
          }
        }
        shuffle(pool);
        pool = pool.slice(0, 50);
      } else {
        // QCM standard
        const qcmPool = QCM_DB[subVal] || QCM_DB[subject] || [];
        pool = qcmPool.map(q => ({ q: q.q, answers: [...q.a], correct: q.c, type: 'qcm', explanation: q.expl }));
        shuffle(pool);
        // Use all available questions
        pool = pool;
      }
      return pool;
    }

    function showQuestion() {
      if (currentQ >= QUESTIONS.length || lives <= 0) { showResults(); return; }
      const q = QUESTIONS[currentQ];
      document.getElementById('qNumber').textContent = `Question ${currentQ + 1} / ${QUESTIONS.length}`;
      document.getElementById('qText').textContent = q.q;
      document.getElementById('qHint').textContent = q.hint || '';
      document.getElementById('progressFill').style.width = `${(currentQ / QUESTIONS.length) * 100}%`;
      document.getElementById('feedback').className = 'feedback';
      document.getElementById('feedback').style.display = 'none';
      document.getElementById('nextBtn').className = 'next-btn';

      const letters = ['A', 'B', 'C', 'D'];
      let html = '';
      q.answers.forEach((a, i) => {
        html += `<div class="answer-btn" onclick="checkAnswer(${i})"><span class="letter">${letters[i] || ''}</span><span>${a}</span></div>`;
      });
      document.getElementById('answersArea').innerHTML = html;
      updateScoreBar();
    }

    function checkAnswer(idx) {
      const q = QUESTIONS[currentQ];
      const btns = document.querySelectorAll('.answer-btn');
      btns.forEach(b => b.classList.add('disabled'));

      const fb = document.getElementById('feedback');
      if (idx === q.correct) {
        btns[idx].classList.add('correct');
        streak++;
        const xp = 10 + (streak > 2 ? streak * 2 : 0);
        score += xp;
        totalCorrect++;
        fb.className = 'feedback correct-fb show';
        fb.innerHTML = `<strong>✅ Correct !</strong> +${xp} XP` + (q.explanation ? `<br>${q.explanation}` : '');
        showXP(xp);
      } else {
        btns[idx].classList.add('wrong');
        btns[q.correct].classList.add('correct');
        streak = 0;
        lives--;
        renderLives();
        errors.push({ q: q.q, given: q.answers[idx], correct: q.answers[q.correct] });
        fb.className = 'feedback wrong-fb show';
        fb.innerHTML = `<strong>❌ Incorrect</strong><br>La bonne réponse : <strong>${q.answers[q.correct]}</strong>` + (q.explanation ? `<br>${q.explanation}` : '');
      }
      document.getElementById('nextBtn').className = 'next-btn show';
      updateScoreBar();
    }

    function nextQuestion() {
      currentQ++;
      showQuestion();
    }

    function renderLives() {
      let h = '';
      for (let i = 0; i < 3; i++) h += `<span class="heart ${i >= lives ? 'lost' : ''}"><i class="fas fa-heart"></i></span>`;
      document.getElementById('livesBar').innerHTML = h;
    }

    function updateScoreBar() {
      document.getElementById('scoreVal').textContent = score;
      document.getElementById('streakVal').textContent = streak > 1 ? `🔥 ${streak} série` : '';
    }

    function showXP(val) {
      const popup = document.getElementById('xpPopup');
      document.getElementById('xpVal').textContent = `+${val}`;
      popup.classList.add('show');
      setTimeout(() => popup.classList.remove('show'), 800);
    }

    // ==================== RESULTS ====================
    function showResults() {
      document.getElementById('gameArea').style.display = 'none';
      document.getElementById('results').style.display = 'block';
      stopTimer();
      
      const pct = QUESTIONS.length ? Math.round((totalCorrect / QUESTIONS.length) * 100) : 0;
      const stars = pct >= 90 ? '⭐⭐⭐' : pct >= 70 ? '⭐⭐' : pct >= 50 ? '⭐' : '💪';
      const title = pct >= 90 ? 'Excellent !' : pct >= 70 ? 'Bien joué !' : pct >= 50 ? 'Pas mal !' : 'Continue tes efforts !';

      // Get best score from localStorage
      const bestScore = JSON.parse(localStorage.getItem('quiz_best_score') || '0');
      const isNewBest = score > bestScore;
      if (isNewBest) {
        localStorage.setItem('quiz_best_score', JSON.stringify(score));
      }

      document.getElementById('resultsTitle').textContent = title;
      document.getElementById('finalScore').textContent = `${score} XP`;
      document.getElementById('starsDisplay').textContent = stars;
      document.getElementById('statsGrid').innerHTML = `
        <div class="stat"><div class="val" style="color:var(--green)">${totalCorrect}</div><div class="lbl">Bonnes réponses</div></div>
        <div class="stat"><div class="val" style="color:var(--red)">${errors.length}</div><div class="lbl">Erreurs</div></div>
        <div class="stat"><div class="val" style="color:var(--accent)">${pct}%</div><div class="lbl">Réussite</div></div>
        <div class="stat"><div class="val" style="color:var(--gold)">${isNewBest ? score : bestScore}</div><div class="lbl">${isNewBest ? '🎉 Record !' : 'Meilleur score'}</div></div>`;

      // Save errors to localStorage for review
      if (errors.length > 0) {
        const errSection = document.getElementById('errorsSection');
        errSection.style.display = 'block';
        errSection.innerHTML = `<h3>📝 Tes erreurs à revoir :</h3>` + errors.map(e => `<div class="error-item"><strong>${e.q}</strong><br>Ta réponse : ${e.given}<br>Bonne réponse : <span class="correct-ans">${e.correct}</span></div>`).join('');
        
        // Save to localStorage
        const saved = JSON.parse(localStorage.getItem('quiz_errors') || '[]');
        saved.push(...errors.map(e => ({ ...e, date: new Date().toISOString() })));
        localStorage.setItem('quiz_errors', JSON.stringify(saved.slice(-100)));
      }

      // Save score history
      const history = JSON.parse(localStorage.getItem('quiz_history') || '[]');
      history.push({ score, pct, total: QUESTIONS.length, correct: totalCorrect, mode: MODE, date: new Date().toISOString() });
      localStorage.setItem('quiz_history', JSON.stringify(history.slice(-50)));
    }

    function resetGame() {
      document.getElementById('setup').style.display = 'block';
      document.getElementById('gameArea').style.display = 'none';
      document.getElementById('results').style.display = 'none';
      stopTimer();
    }

    // ==================== AUDIO ====================
    const audioBtn = document.getElementById('audioBtn');
    let speaking = false;
    audioBtn.addEventListener('click', () => {
      if (speaking) { speechSynthesis.cancel(); speaking = false; audioBtn.classList.remove('speaking'); return; }
      const qText = document.getElementById('qText').textContent;
      if (!qText) return;
      const utter = new SpeechSynthesisUtterance(qText);
      utter.lang = 'fr-FR'; utter.rate = 0.9;
      utter.onend = () => { speaking = false; audioBtn.classList.remove('speaking'); };
      speechSynthesis.speak(utter);
      speaking = true; audioBtn.classList.add('speaking');
    });

    // ==================== UTILS ====================
    function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

    // ==================== TIMER ====================
    function fmt(ms){ const t=Math.max(0,ms); const m=Math.floor(t/60000), s=Math.floor((t%60000)/1000); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
    function paintTimer(){ const el=document.getElementById('timerVal'); if(!el) return; el.textContent = timerMs>0? `⏱️ ${fmt(timerMs)}` : ''; }
    function startTimer(mins){ timerMs=mins*60000; paintTimer(); timerId=setInterval(()=>{ timerMs-=1000; paintTimer(); if(timerMs<=0){ stopTimer(); showResults(); } },1000); }
    function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } timerMs=0; paintTimer(); }

    // Init
    loadSubjects().then(() => {
      const requestedMode = sessionStorage.getItem('quizMode');
      if (requestedMode) {
        const card = document.querySelector(`.mode-card[data-mode="${requestedMode}"]`);
        if (card) selectMode(card);
        sessionStorage.removeItem('quizMode');
      }
    });
    try{ if('serviceWorker' in navigator){ navigator.serviceWorker.register('/service-worker.js'); } }catch(e){}
  </script>
</body>
</html>
